<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Project — Vishay Agarwal</title>
<script>(function(){try{var m=localStorage.getItem("v1shay-theme")||"auto";document.documentElement.dataset.themeMode=m;if(m==="light"||m==="dark")document.documentElement.dataset.theme=m;}catch(e){}})();</script>
<link rel="stylesheet" href="./project.css" />
</head>
<body>
<a class="corner-link back-link" href="./">← back</a>
<a class="corner-link github-link" id="github-link" href="#" target="_blank" rel="noreferrer">gh</a>
<main class="project-page">
  <div class="ascii-stage"><pre class="ascii" id="project-art" aria-label="Project ASCII artwork"></pre></div>
  <section class="project-meta"><h1 id="project-title"></h1><p id="project-description"></p></section>
</main>
<div class="theme-switcher" aria-label="Theme"><button type="button" data-theme-choice="auto">auto</button><button type="button" data-theme-choice="light">light</button><button type="button" data-theme-choice="dark">dark</button></div>
<script>
(function(){
  var key=new URLSearchParams(location.search).get("p");
  var allowed={"archllm":1,"moonshot-robotics":1,"erevna":1,"ml-labs":1,"neuro-sense":1,"ido":1,"echo-os":1,"sift":1};
  if(!allowed[key]){location.replace("./");return;}
  function unzip(v){var b=atob(v),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return new Response(new Blob([u]).stream().pipeThrough(new DecompressionStream("gzip"))).text();}
  function show(){
    var p=window.PROJECT;
    document.title=p.title+" — Vishay Agarwal";
    document.getElementById("project-title").textContent=p.title;
    document.getElementById("project-description").textContent=p.description;
    document.getElementById("github-link").href=p.github;
    document.getElementById("project-art").setAttribute("aria-label",p.title+" ASCII artwork");
    if(p.art){document.getElementById("project-art").textContent=p.art;return;}
    unzip(p.artGzip).then(function(a){document.getElementById("project-art").textContent=a.replace(/\n$/,"");}).catch(function(){document.getElementById("project-art").textContent="ASCII art unavailable.";});
  }
  var s=document.createElement("script");s.src="./project-data/"+key+".js";s.onload=show;s.onerror=function(){document.getElementById("project-art").textContent="Project data unavailable.";};document.body.appendChild(s);
})();
</script>
<script src="./theme.js"></script>
</body>
</html>
